---
# One KSA for every Cloud SQL workload in `default` (both phases). Workload
# Identity maps it to the GSA created by deploy/terraform (#563), which has
# roles/cloudsql.client for the cloud-sql-proxy sidecars.
# Rendered by the dev pipeline only (CI skips it for prod) so a single ArgoCD
# app owns it; Prune=false keeps it alive for prod pods if that ever changes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: password-exchange
  namespace: default
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    iam.gke.io/gcp-service-account: password-exchange-sql@gen-lang-client-0479899208.iam.gserviceaccount.com
# The app images on GHCR are private. The `default` KSA carries this pull
# secret; pods moved onto this KSA lose it unless it is repeated here.
imagePullSecrets:
  - name: regcred
---
# Install RabbitMQ Cluster Operator
# kubectl apply -f "https://github.com/rabbitmq/cluster-operator/releases/latest/download/cluster-operator.yml"

# RabbitMQ Cluster Instance
apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: rabbitmq
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 3
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
          - key: stable
            operator: In
            values:
            - rabbit
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                - rabbitmq
          topologyKey: "kubernetes.io/hostname"
  tolerations:
  - key: stable
    operator: Equal
    value: rabbit
    effect: NoSchedule
  service:
    type: ClusterIP
  persistence:
    storageClassName: "standard-rwo"  # Use default storage class
    storage: 3Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 1Gi
  rabbitmq:
    additionalConfig: |
      management.tcp.port = 15672
      management.tcp.ip = 0.0.0.0
      log.console.level = info
    envConfig: |
      RABBITMQ_DEFAULT_USER=guest
      RABBITMQ_DEFAULT_PASS=guest
