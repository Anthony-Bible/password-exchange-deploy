          - name: OAUTHDB_MAX_OVERFLOW
            valueFrom:
              secretKeyRef:
                key: OAUTHDB_MAX_OVERFLOW
                name: password-exchange-db-prod
          - name: SLACK_SIGNING_SECRET
            valueFrom:
              secretKeyRef:
                key: SLACK_SIGNING_SECRET
                name: test-secret
          - name: SLACK_CLIENT_ID
            valueFrom:
