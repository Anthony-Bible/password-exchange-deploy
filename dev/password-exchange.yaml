              secretKeyRef:
                key: PASSWORDEXCHANGE_ENCRYPTIONPRODSERVICE
                name: test-secret
          - name: PASSWORDEXCHANGE_DATABASESERVICE
            valueFrom:
              secretKeyRef:
                key: PASSWORDEXCHANGE_DATABASEPRODSERVICE
                name: test-secret
          - name: PASSWORDEXCHANGE_HOST
            valueFrom:
              secretKeyRef:
                key: PASSWORDEXCHANGE_PRODHOST
                name: test-secret
          # OAuth DB target: always the prod Secret (see the note at the top).
          - name: PASSWORDEXCHANGE_DBDRIVER
            valueFrom:
              secretKeyRef:
                key: PASSWORDEXCHANGE_DBDRIVER
                name: password-exchange-db-prod
          - name: PASSWORDEXCHANGE_DBHOST
            valueFrom:
              secretKeyRef:
                key: PASSWORDEXCHANGE_DBHOST
                name: password-exchange-db-prod
          - name: PASSWORDEXCHANGE_DBPORT
            valueFrom:
