apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: database
  name: database-dev-deployment
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      annotations:
        linkerd.io/inject: enabled
        # 3306: prod still on MySQL via the in-cluster cloudsql-proxy (until #570).
        # 3307: cloud-sql-proxy's TLS connection to Cloud SQL. 127.0.0.1:5432 is loopback.
        config.linkerd.io/skip-outbound-ports: "3306,3307"
        # Start linkerd-proxy before cloud-sql-proxy so the proxy's Admin API and
        # metadata-server calls aren't caught by iptables with no proxy listening.
        config.alpha.linkerd.io/proxy-enable-native-sidecar: "true"
      labels:
        app: database
        name: database
        phase: "dev"
        version: "d442738" 
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - database
              topologyKey: kubernetes.io/hostname
      serviceAccountName: password-exchange
      initContainers:
      # Cloud SQL Auth Proxy as a native sidecar: starts before the app, and does
      # not keep a Job from completing. Identity comes from Workload Identity.
      - name: cloud-sql-proxy
        image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.22.0
        restartPolicy: Always
        args:
        - --structured-logs
        - --port=5432
        - --health-check
        - --http-address=0.0.0.0
        - --http-port=9801
        - gen-lang-client-0479899208:us-central1:sre-bible
        startupProbe:
          httpGet:
            path: /startup
            port: 9801
          periodSeconds: 1
          failureThreshold: 60
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
      containers:
      - envFrom:
        - secretRef:
            name: test-secret
        # DB target for this phase; listed last so its keys win over test-secret.
        - secretRef:
            name: password-exchange-db-dev
        image: ghcr.io/anthony-bible/passwordexchange-container-dev@sha256:71cda4cbbe7c8e15058c5e9100d8a3fcf81208437eb70382ab5fae6e24af953f
        args: ["database"]
        env:
        - name: "PASSWORDEXCHANGE_RUNNING_ENVIRONMENT"
          value: "dev"
        name: database
        ports:
        - containerPort: 50051
          name: grpc
          protocol: TCP
        livenessProbe:
          grpc:
            port: 50051
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          grpc:
            port: 50051
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3


---
apiVersion: v1
kind: Service
metadata:
  name: database-dev-service 
  annotations:
  namespace: default
spec:
  selector:
    app: database
    phase: dev
  ports:
    - name: grpc 
      port: 50051 
      targetPort: 50051

