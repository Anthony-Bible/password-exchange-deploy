apiVersion: batch/v1
kind: CronJob
metadata:
  name: password-exchange-reminder-dev
  namespace: default
  labels:
    app: password-exchange
    component: reminder
    phase: "dev"
spec:
  # Every 10 minutes. Each run starts a fresh cloud-sql-proxy (~1-2 s).
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid  # Don't allow overlapping jobs
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 1
  startingDeadlineSeconds: 300  # Job must start within 5 minutes of scheduled time
  jobTemplate:
    spec:
      # Clean up completed jobs after 6 hours
      ttlSecondsAfterFinished: 21600
      template:
        metadata:
          annotations:
            linkerd.io/inject: enabled
            # 3306: prod still on MySQL via the in-cluster cloudsql-proxy (until #570).
            # 3307: cloud-sql-proxy's TLS connection to Cloud SQL. 127.0.0.1:5432 is loopback.
            config.linkerd.io/skip-outbound-ports: "3306,3307"
            # Start linkerd-proxy before cloud-sql-proxy so the proxy's Admin API and
            # metadata-server calls aren't caught by iptables with no proxy listening.
            config.alpha.linkerd.io/proxy-enable-native-sidecar: "true"
          labels:
            app: password-exchange
            component: reminder
            phase: "dev"
        spec:
          restartPolicy: OnFailure
          serviceAccountName: password-exchange
          initContainers:
          # Cloud SQL Auth Proxy as a native sidecar: starts before the app, and does
          # not keep a Job from completing. Identity comes from Workload Identity.
          - name: cloud-sql-proxy
            image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.22.0
            restartPolicy: Always
            args:
            - --structured-logs
            - --port=5432
            - --health-check
            - --http-address=0.0.0.0
            - --http-port=9801
            - gen-lang-client-0479899208:us-central1:sre-bible
            startupProbe:
              httpGet:
                path: /startup
                port: 9801
              periodSeconds: 1
              failureThreshold: 60
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 100m
                memory: 128Mi
            securityContext:
              runAsNonRoot: true
              allowPrivilegeEscalation: false
          containers:
          - name: reminder
            image: ghcr.io/anthony-bible/passwordexchange-container-dev@sha256:71cda4cbbe7c8e15058c5e9100d8a3fcf81208437eb70382ab5fae6e24af953f
            imagePullPolicy: Always
            command: ["/app/app"]
            args: ["reminder", "--config=/config/config.yaml"]
            envFrom:
              - secretRef:
                  name: test-secret
              # DB target for this phase; listed last so its keys win over test-secret.
              - secretRef:
                  name: password-exchange-db-dev
            env:
            # Reminder holds one slot of the shared sre-bible connection budget.
            - name: PASSWORDEXCHANGE_DBMAXOPENCONNS
              value: "1"
            # Reminder configuration
            - name: PASSWORDEXCHANGE_REMINDER_ENABLED
              value: "true"
            - name: PASSWORDEXCHANGE_REMINDER_CHECKAFTERHOURS
              value: "24"
            - name: PASSWORDEXCHANGE_REMINDER_MAXREMINDERS
              value: "3"
            - name: PASSWORDEXCHANGE_REMINDER_INTERVAL
              value: "24"
            # Logging
            - name: PASSWORDEXCHANGE_LOGLEVEL
              value: "info"
            volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            resources:
              requests:
                memory: "64Mi"
                cpu: "50m"
              limits:
                memory: "128Mi"
                cpu: "100m"
          volumes:
          - name: config
            configMap:
              name: password-exchange-config-dev
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: password-exchange-config-dev
  namespace: default
  labels:
    app: password-exchange
data:
  config.yaml: |
    # Minimal config for reminder service
    loglevel: info
    reminder:
      enabled: true
      checkafterhours: 24
      maxreminders: 3
      reminderinterval: 24

